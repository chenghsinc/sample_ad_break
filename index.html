<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom CAF Receiver - Debugged</title>
  
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

  <style>
    body {
      background-color: #000000;
      margin: 0;
    }
    cast-media-player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // Setup Cast Debug Logger
    const castDebugLogger = cast.debug.CastDebugLogger.getInstance();
    castDebugLogger.setEnabled(true);
    // castDebugLogger.showDebugLogs(true); // Shows overlay on TV

    castDebugLogger.loggerLevelByEvents = {
      'cast.framework.events.category.CORE': cast.framework.LoggerLevel.INFO,
      'cast.framework.events.EventType.MEDIA_STATUS': cast.framework.LoggerLevel.DEBUG
    };

    // SAFE Error logging (DO NOT use JSON.stringify on CAF events!)
    playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
      // Safely extract the error code without stringifying the whole event
      const safeErrorMsg = `ErrorCode: ${event.detailedErrorCode}, Reason: ${event.error ? event.error.message : 'Unknown'}`;
      castDebugLogger.error('ERROR_CATCHER', 'Fatal Player Error: ' + safeErrorMsg);
    });

    const playbackConfig = new cast.framework.PlaybackConfig();

    playbackConfig.manifestHandler = (manifest) => {
      castDebugLogger.info('MANIFEST_HANDLER', 'Patching manifest...');
      
      let patched = manifest.replace(
        /<AdaptationSet([^>]+)>/g, 
        (match, attributes) => {
          const isAudio = attributes.includes('contentType="audio"') || attributes.includes('mimeType="audio/');
          if (isAudio && !attributes.includes('lang=')) {
            return `<AdaptationSet${attributes} lang="en">`;
          }
          return match;
        }
      );

      // Strip forced-subtitle to prevent Shaka Player crash
      patched = patched.replace(
        /<Accessibility schemeIdUri="urn:mpeg:dash:role:2011" value="forced-subtitle"\s*\/?\>/g, 
        ''
      );

      return patched;
    };

    // Manually enable forced subtitle
    playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
      const textTracksManager = playerManager.getTextTracksManager();
      const tracks = playerManager.getTracks();
      
      const enTextTrack = tracks.find(track => 
        track.type === cast.framework.messages.TrackType.TEXT && 
        track.language && track.language.startsWith('en')
      );

      if (enTextTrack) {
        castDebugLogger.info('TRACK_MANAGER', 'Manually activating forced subtitle: ' + enTextTrack.trackId);
        textTracksManager.setActiveByIds([enTextTrack.trackId]);
      }
    });

    context.start({ playbackConfig: playbackConfig });
  </script>
</body>
</html>
