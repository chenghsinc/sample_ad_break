<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom CAF Receiver - Debugged Forced Subtitle Fix</title>
  
  <!-- 1. Load CAF Receiver SDK (Latest v3) -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <!-- 2. Load Cast Debug Logger SDK -->
  <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

  <style>
    body {
      --playback-logo-image: url('https://www.gstatic.com/images/branding/googlelogo/svg/googlelogo_clr_74x24px.svg');
      background-color: #000000;
      margin: 0;
    }
    cast-media-player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  
<script>
    const context = cast.framework.CastReceiverContext.getInstance();
  const playerManager = context.getPlayerManager();
  const playbackConfig = new cast.framework.PlaybackConfig();

  playbackConfig.manifestHandler = (manifest) => {
    // 1. Add lang="en" to audio tracks so language matching works
    let patched = manifest.replace(
      /<AdaptationSet([^>]+)>/g, 
      (match, attributes) => {
        const isAudio = attributes.includes('contentType="audio"') || attributes.includes('mimeType="audio/');
        if (isAudio && !attributes.includes('lang=')) {
          return `<AdaptationSet${attributes} lang="en">`;
        }
        return match;
      }
    );

    // 2. STRIP the forced-subtitle Accessibility tag to prevent Shaka Player 
    // from crashing when it tries to auto-play it during the text-less Ad Period.
    patched = patched.replace(
      /<Accessibility schemeIdUri="urn:mpeg:dash:role:2011" value="forced-subtitle"\s*\/?\>/g, 
      ''
    );

    return patched;
  };

  // 3. Manually enable the forced text track once the media safely loads
  playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
    const textTracksManager = playerManager.getTextTracksManager();
    const tracks = playerManager.getTracks();
    
    // Find the English text track that we want to force
    const enTextTrack = tracks.find(track => 
      track.type === cast.framework.messages.TrackType.TEXT && 
      track.language && track.language.startsWith('en')
    );

    if (enTextTrack) {
      console.log('Manually activating forced subtitle track:', enTextTrack.trackId);
      textTracksManager.setActiveByIds([enTextTrack.trackId]);
    }
  });

  context.start({ playbackConfig: playbackConfig });


</script>

</body>
</html>
