<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robust SSAI/DAI Web Receiver</title>
  <!-- Load the Web Receiver SDK -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body {
      background-color: #000000;
      margin: 0;
    }
    cast-media-player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  
  <script>
    const myReceiverContext = cast.framework.CastReceiverContext.getInstance();
    const myPlayerManager = myReceiverContext.getPlayerManager();
    const myPlaybackConfig = new cast.framework.PlaybackConfig();

    /**
     * XML-based manifest handler designed to resolve b/548205594 in DAI/SSAI.
     * Iterates through the MPD, finds audio AdaptationSets that lack a 'lang' attribute
     * (which typically belong to the stitched ad Periods), and dynamically injects 'en'.
     */
    myPlaybackConfig.manifestHandler = (manifestText) => {
      try {
        const parser = new DOMParser();
        // Parse the raw DASH manifest (.mpd) XML string
        const xmlDoc = parser.parseFromString(manifestText, 'application/xml');
        
        // Query all AdaptationSets regardless of XML namespace prefixes (like 'dash:')
        const adaptationSets = xmlDoc.querySelectorAll('AdaptationSet');
        let patchCount = 0;

        adaptationSets.forEach((adaptationSet) => {
          const contentType = adaptationSet.getAttribute('contentType');
          const mimeType = adaptationSet.getAttribute('mimeType');
          
          const isAudio = contentType === 'audio' || (mimeType && mimeType.startsWith('audio/'));
          
          // If it is an audio track and lacks a 'lang' attribute, assign the fallback language
          if (isAudio && !adaptationSet.hasAttribute('lang')) {
            // Assign 'en' (or your primary target language) so that Shaka Player's 
            // initial variant language matching does not resolve to 'und'
            adaptationSet.setAttribute('lang', 'en'); 
            patchCount++;
          }
        });

        if (patchCount > 0) {
          console.log(`[ManifestWorkaround] Injected fallback language 'en' into ${patchCount} audio track(s).`);
        }

        // Serialize the modified XML back to string representation
        const serializer = new XMLSerializer();
        return serializer.serializeToString(xmlDoc);
      } catch (error) {
        console.error('[ManifestWorkaround] Failed to parse/modify MPD XML, falling back to raw manifest:', error);
        return manifestText;
      }
    };

    // Start the receiver context with the customized PlaybackConfig
    myReceiverContext.start({ playbackConfig: myPlaybackConfig });
  </script>
</body>
</html>
