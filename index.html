<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom CAF Receiver - Debugged Forced Subtitle Fix</title>
  
  <!-- 1. Load CAF Receiver SDK (Latest v3) -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <!-- 2. Load Cast Debug Logger SDK -->
  <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

  <style>
    body {
      --playback-logo-image: url('https://www.gstatic.com/images/branding/googlelogo/svg/googlelogo_clr_74x24px.svg');
      background-color: #000000;
      margin: 0;
    }
    cast-media-player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  
<script>
    const context = cast.framework.CastReceiverContext.getInstance();
  const playbackConfig = new cast.framework.PlaybackConfig();

  playbackConfig.manifestHandler = (manifest) => {
    // 1. Find all <AdaptationSet ...> opening tags
    let patchedCount = 0;
    
    const patchedManifest = manifest.replace(
      /<AdaptationSet([^>]+)>/g, 
      (match, attributes) => {
        // 2. Check if it's an audio track and lacks a 'lang' attribute
        const isAudio = attributes.includes('contentType="audio"') || attributes.includes('mimeType="audio/');
        const hasLang = attributes.includes('lang=');
        
        if (isAudio && !hasLang) {
          patchedCount++;
          // 3. Safely inject lang="en" before the closing bracket of the tag
          return `<AdaptationSet${attributes} lang="en">`;
        }
        
        // Return unchanged if it doesn't need patching
        return match;
      }
    );

    if (patchedCount > 0) {
      console.log(`Successfully patched ${patchedCount} audio AdaptationSet(s) with fallback 'lang="en"'.`);
    }

    // Return the safe, intact string
    return patchedManifest;
  };

  context.start({ playbackConfig: playbackConfig });

</script>

</body>
</html>
