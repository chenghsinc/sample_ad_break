<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom CAF Receiver - Debugged</title>
  
  <!-- 1. Load CAF Receiver SDK -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <!-- 2. Load Cast Debug Logger SDK -->
  <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

  <style>
    body {
      background-color: #000000;
      margin: 0;
    }
    cast-media-player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  
  <script>
    // 1. Initialize Cast Receiver Context
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // 2. Setup Cast Debug Logger for ON-SCREEN debugging
    const castDebugLogger = cast.debug.CastDebugLogger.getInstance();
    castDebugLogger.setEnabled(true);
    
    // WARNING: This draws the debug overlay right on your TV screen!
    castDebugLogger.showDebugLogs(true); 

    // Set verbosity levels
    castDebugLogger.loggerLevelByEvents = {
      'cast.framework.events.category.CORE': cast.framework.LoggerLevel.INFO,
      'cast.framework.events.EventType.MEDIA_STATUS': cast.framework.LoggerLevel.DEBUG
    };
    castDebugLogger.loggerLevelByTags = {
      'MANIFEST_HANDLER': cast.framework.LoggerLevel.DEBUG,
      'ERROR_CATCHER': cast.framework.LoggerLevel.ERROR
    };

    // 3. Catch all errors and print them to the TV screen
    playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
      castDebugLogger.error('ERROR_CATCHER', 'Fatal Player Error: ' + JSON.stringify(event));
    });

    const playbackConfig = new cast.framework.PlaybackConfig();

    // 4. Safe Manifest Handler
    playbackConfig.manifestHandler = (manifest) => {
      castDebugLogger.info('MANIFEST_HANDLER', 'Manifest received. Patching...');
      
      let patched = manifest.replace(
        /<AdaptationSet([^>]+)>/g, 
        (match, attributes) => {
          const isAudio = attributes.includes('contentType="audio"') || attributes.includes('mimeType="audio/');
          if (isAudio && !attributes.includes('lang=')) {
            return `<AdaptationSet${attributes} lang="en">`;
          }
          return match;
        }
      );

      // Strip forced-subtitle to prevent Shaka Player multi-period crash
      patched = patched.replace(
        /<Accessibility schemeIdUri="urn:mpeg:dash:role:2011" value="forced-subtitle"\s*\/?\>/g, 
        ''
      );

      castDebugLogger.info('MANIFEST_HANDLER', 'Manifest patched successfully.');
      return patched;
    };

    // 5. Start the Receiver
    context.start({ playbackConfig: playbackConfig });

  </script>
</body>
</html>
